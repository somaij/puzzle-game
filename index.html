<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Daily Jigsaw</title>
    <meta name="description" content="One jigsaw a day, the same for everyone." />
    <!-- Installing to a home screen. Paths are relative so the site works under any base path. -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#1f2442" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Daily Jigsaw" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        /* The game's background, so an installed app doesn't flash white while it starts. */
        background-color: #1f2442;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
        position: relative;
      }
      /* The backdrop: flowing paint in the colours of the day's photo, drawn by src/ui/backdrop.ts. Web only. */
      #backdrop {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: block;
        opacity: 0;
        transition: opacity 0.8s ease-out;
      }
      #backdrop.on {
        opacity: 1;
      }
      /* Fine still scanlines over the moving colour, in the board's dark indigo, to quieten it. */
      #backdrop-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: repeating-linear-gradient(to bottom, rgba(20, 24, 46, 0.5) 0 1px, transparent 1px 3px);
      }
    </style>
  <link rel="icon" href="/puzzle-game/favicon.ico"/></head>

  <body>
    <noscript>You need to enable JavaScript to play.</noscript>
    <canvas id="backdrop" aria-hidden="true"></canvas>
    <div id="backdrop-overlay" aria-hidden="true"></div>
    <div id="root"></div>
  <script src="/puzzle-game/_expo/static/js/web/index-a849a98e74b17ba8fd92ca7cae811f3b.js" defer></script>
</body>
</html>
